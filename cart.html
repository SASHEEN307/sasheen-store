{% extends "base.html" %}

{% block content %}

<section class="section">

<h2 class="section-title">
Your Luxury Selection
</h2>

{% for item in items %}

<div style="
background:white;
width:320px;
margin:15px auto;
padding:20px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
">

<h3>{{item.name}}</h3>

<div class="price">
${{item.price}}
</div>

</div>

{% endfor %}

<h2 style="margin-top:40px;">
Total:
<span style="color:#b48b5b;">
${{total}}
</span>
</h2>

<a href="/clear" class="btn">
CLEAR CART
</a>

<br><br>

<a href="https://wa.me/201000000000" class="btn">
CHECKOUT VIA WHATSAPP
</a>

</section>

{% endblock %}
