<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SASHÉEN | Luxury House</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f8f5f1;
    font-family:'Montserrat',sans-serif;
    color:#111;
    overflow-x:hidden;
}

/* NAVBAR */

nav{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:25px 70px;
    position:fixed;
    top:0;
    z-index:1000;
    background:rgba(255,255,255,0.75);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(0,0,0,0.05);
}

.logo{
    font-family:'Cormorant Garamond',serif;
    font-size:38px;
    letter-spacing:6px;
    color:#b48b5b;
    font-weight:600;
}

nav a{
    text-decoration:none;
    color:#111;
    margin-left:25px;
    font-size:14px;
    letter-spacing:2px;
    transition:0.3s;
}

nav a:hover{
    color:#b48b5b;
}

/* HERO */

.hero{
    height:100vh;
    background:
    linear-gradient(rgba(0,0,0,0.35),
    rgba(0,0,0,0.35)),
    url('https://images.unsplash.com/photo-1529139574466-a303027c1d8b?q=80&w=1600');

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
}

.hero-content{
    animation:fadeUp 1.5s ease;
}

.hero h1{
    font-family:'Cormorant Garamond',serif;
    font-size:95px;
    letter-spacing:10px;
}

.hero p{
    margin-top:15px;
    font-size:18px;
    letter-spacing:3px;
}

.btn{
    display:inline-block;
    margin-top:35px;
    padding:14px 34px;
    border-radius:40px;
    text-decoration:none;
    background:#b48b5b;
    color:white;
    letter-spacing:2px;
    transition:0.4s;
}

.btn:hover{
    transform:translateY(-4px);
    background:#8c6c44;
}

/* PRODUCTS */

.section{
    padding:120px 60px;
    text-align:center;
}

.section-title{
    font-family:'Cormorant Garamond',serif;
    font-size:60px;
    color:#b48b5b;
    margin-bottom:60px;
}

.products{
    display:flex;
    justify-content:center;
    gap:35px;
    flex-wrap:wrap;
}

.card{
    width:300px;
    background:white;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,0.08);
    transition:0.5s;
}

.card:hover{
    transform:translateY(-12px);
    box-shadow:0 15px 50px rgba(0,0,0,0.15);
}

.card img{
    width:100%;
    height:370px;
    object-fit:cover;
    transition:0.5s;
}

.card:hover img{
    transform:scale(1.05);
}

.card-body{
    padding:25px;
}

.card h3{
    font-family:'Cormorant Garamond',serif;
    font-size:32px;
}

.price{
    margin-top:10px;
    color:#b48b5b;
    font-size:24px;
    font-weight:600;
}

/* FOOTER */

footer{
    background:#111;
    color:white;
    text-align:center;
    padding:35px;
    margin-top:80px;
    letter-spacing:2px;
}

/* ANIMATION */

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

</style>

</head>

<body>

<nav>

<div class="logo">SASHÉEN</div>

<div>
    <a href="/">HOME</a>
    <a href="/shop">SHOP</a>
    <a href="/cart">CART</a>
</div>

</nav>

{% block content %}

{% endblock %}

<footer>

SASHÉEN © 2026 — PARIS INSPIRED LUXURY HOUSE

</footer>

</body>
</html>
